# ============================================================
# Apache vhost — taxi-drive.ch  (Taxi Drive)
# ------------------------------------------------------------
# ATTENTION au nom exact du domaine : taxi-drive.ch (AVEC tiret).
#
# Fichier volontairement minimal et EN HTTP SEULEMENT.
# Le HTTPS n'est PAS écrit ici : c'est `certbot --apache` qui
# génère le vhost :443 avec les bons chemins de certificats.
# Écrire le SSL à la main avant d'avoir le certificat empêche
# Apache de démarrer -> site inaccessible / cadenas cassé.
#
# Installation :
#   sudo cp deploy/apache/taxi-drive.ch.conf /etc/apache2/sites-available/
#   sudo a2ensite taxi-drive.ch.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
# ============================================================

<VirtualHost *:80>
    ServerName taxi-drive.ch
    ServerAlias www.taxi-drive.ch

    DocumentRoot /var/www/taxidrive

    <Directory /var/www/taxidrive>
        Options -Indexes +FollowSymLinks
        # INDISPENSABLE : active le .htaccess (URLs propres /taxi-nyon/taxi-<ville>,
        # redirections 301 des anciennes URLs Webador, gzip, cache, en-têtes).
        AllowOverride All
        Require all granted
    </Directory>

    # Bloque l'accès direct aux fichiers cachés (.htaccess, .git...)
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/taxidrive_error.log
    CustomLog ${APACHE_LOG_DIR}/taxidrive_access.log combined
</VirtualHost>
